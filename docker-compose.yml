# Local development environment: Nextcloud 35 + Postgres + cron, with this
# repository mounted as custom_apps/apple_sync.
#   make up      -> start, then open http://localhost:8089 (admin / admin-dev-pass)
#   make enable  -> enable the app and the Contacts/Calendar/Tasks/Photos apps
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: nextcloud:35-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-dev-pass
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud:/var/www/html
      - ./:/var/www/html/custom_apps/apple_sync
    depends_on:
      - db

  cron:
    image: nextcloud:35-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
      - ./:/var/www/html/custom_apps/apple_sync
    depends_on:
      - app

volumes:
  db:
  nextcloud:
